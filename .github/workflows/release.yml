name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: fast-file-editor
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: fast-file-editor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: fast-file-editor.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: servers/filesystem/fast-file-editor
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="fast-file-editor-${TAG}-${{ matrix.target }}.${{ matrix.archive }}"
          SRC="servers/filesystem/fast-file-editor/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          mkdir dist
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "dist/${ARCHIVE_NAME}" -C "." "${{ matrix.bin }}"
          else
            7z a "dist/${ARCHIVE_NAME}" "./$SRC"
          fi
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
